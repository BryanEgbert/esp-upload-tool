name: Build with Nuitka

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '.github/workflows/build.yml'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Check-out repository
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        architecture: 'x64'
        cache: 'pip'
        cache-dependency-path: |
          **/requirements*.txt

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Copy espefuse data files
      run: |
        python -c "import espefuse, shutil, os; src = os.path.dirname(espefuse.__file__); shutil.copytree(src, 'espefuse')"

    - name: Build Executable
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: main.py
        mode: app
        enable-plugins: pyside6
        include-package: |
          esptool
          espefuse
          espsecure
          PySide6.QtOpenGL
        include-data-dir: |
          espefuse=espefuse
        product-name: ESP Upload Tool
        product-version: 1.0.0
        file-version: 1.0.0
        file-description: ESP Upload Tool
        windows-console-mode: force

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ runner.os }} Build
        path: |
          build/*.exe
          build/*.bin
          build/*.app/**/*
          build/*.dist/**/*
        include-hidden-files: true
